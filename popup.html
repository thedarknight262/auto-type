<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
    }
    h2 {
      margin: 0 0 14px 0;
      font-size: 18px;
      color: #38bdf8;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
    }
    textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .options {
      margin: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label {
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #0ea5e9;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #0ea5e9;
    }
    .speed-value {
      min-width: 45px;
      font-size: 13px;
      color: #94a3b8;
    }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0284c7;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h2>CodeKata Auto Typer</h2>
  
  <textarea id="codeInput" placeholder="Paste your full code here..."></textarea>

  <div class="options">
    <div class="option-row">
      <input type="checkbox" id="clearFirst" checked>
      <label for="clearFirst">Clear Editor first</label>
    </div>

    <div class="option-row">
      <input type="checkbox" id="slowMode">
      <label for="slowMode">Type slowly (human-like)</label>
    </div>

    <div class="option-row" id="speedRow" style="display: none;">
      <label>Speed:</label>
      <input type="range" id="speedSlider" min="15" max="80" value="35">
      <span class="speed-value" id="speedValue">35ms</span>
    </div>
  </div>

  <button id="typeBtn">Type Code into Editor</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
